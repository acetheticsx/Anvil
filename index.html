<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#0d1117">
  <meta
    name="description"
    content="Anvil — developer activity, Git history and project analytics."
  >
  <title>Anvil — Developer Activity</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <script
    src="https://unpkg.com/lucide@latest"
    defer
  ></script>

  <style>
    :root {
      color-scheme: dark;

      --bg: #0d1117;
      --bg-deep: #010409;
      --surface: #161b22;
      --surface-2: #1c2128;
      --surface-3: #21262d;

      --border: #30363d;
      --border-muted: #21262d;

      --text: #e6edf3;
      --muted: #8b949e;
      --subtle: #6e7681;

      --accent: #58a6ff;
      --accent-hover: #79c0ff;

      --green: #3fb950;
      --green-hover: #56d364;
      --red: #f85149;
      --yellow: #d29922;
      --purple: #bc8cff;

      --heat-0: #161b22;
      --heat-1: #0e4429;
      --heat-2: #006d32;
      --heat-3: #26a641;
      --heat-4: #39d353;

      --radius: 8px;
      --shadow: 0 12px 40px rgba(0, 0, 0, .25);

      /* Theme-aware surfaces (previously hardcoded) */
      --panel-bg: rgba(22, 27, 34, .88);
      --overlay: rgba(1, 4, 9, .72);
      --tooltip-bg: #24292f;
      --tooltip-text: #ffffff;
      --day-outline: rgba(230, 237, 243, .8);
      --glow: rgba(56, 139, 253, .08);
      --nav-active-bg: rgba(56, 139, 253, .12);
      --on-primary: #ffffff;

      --ok-text: #7ee787;
      --ok-bg: rgba(46, 160, 67, .07);
      --ok-border: rgba(63, 185, 80, .25);

      --err-text: #ff7b72;
      --err-bg: rgba(248, 81, 73, .07);
      --err-border: rgba(248, 81, 73, .25);

      --warn-text: #e3b341;
      --warn-bg: rgba(210, 153, 34, .07);
      --warn-border: rgba(210, 153, 34, .25);

      --delta-up-text: #7ee787;
      --delta-up-bg: rgba(63, 185, 80, .1);
      --delta-down-text: #ff7b72;
      --delta-down-bg: rgba(248, 81, 73, .1);

      --font:
        "Instrument Sans",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      --mono:
        "JetBrains Mono",
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;
    }

    [data-theme="light"] {
      color-scheme: light;

      --bg: #ffffff;
      --bg-deep: #f6f8fa;
      --surface: #f6f8fa;
      --surface-2: #ffffff;
      --surface-3: #eaeef2;

      --border: #d0d7de;
      --border-muted: #d8dee4;

      --text: #1f2328;
      --muted: #59636e;
      --subtle: #6e7781;

      --accent: #0969da;
      --accent-hover: #0550ae;

      --green: #1a7f37;
      --green-hover: #116329;
      --red: #cf222e;
      --yellow: #9a6700;
      --purple: #8250df;

      --heat-0: #ebedf0;
      --heat-1: #9be9a8;
      --heat-2: #40c463;
      --heat-3: #30a14e;
      --heat-4: #216e39;

      --shadow: 0 12px 40px rgba(31, 35, 40, .12);

      --panel-bg: rgba(255, 255, 255, .92);
      --overlay: rgba(31, 35, 40, .45);
      --tooltip-bg: #1f2328;
      --tooltip-text: #ffffff;
      --day-outline: rgba(31, 35, 40, .75);
      --glow: rgba(9, 105, 218, .06);
      --nav-active-bg: rgba(9, 105, 218, .1);
      --on-primary: #ffffff;

      --ok-text: #1a7f37;
      --ok-bg: rgba(26, 127, 55, .08);
      --ok-border: rgba(26, 127, 55, .3);

      --err-text: #cf222e;
      --err-bg: rgba(207, 34, 46, .08);
      --err-border: rgba(207, 34, 46, .3);

      --warn-text: #9a6700;
      --warn-bg: rgba(154, 103, 0, .08);
      --warn-border: rgba(154, 103, 0, .3);

      --delta-up-text: #1a7f37;
      --delta-up-bg: rgba(26, 127, 55, .1);
      --delta-down-text: #cf222e;
      --delta-down-bg: rgba(207, 34, 46, .1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-width: 320px;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% -15%,
          var(--glow),
          transparent 32%
        ),
        var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
    }

    body.modal-open {
      overflow: hidden;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible,
    a:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    a {
      color: var(--accent);
    }

    svg {
      flex: 0 0 auto;
    }

    .app {
      width: min(1380px, 100%);
      margin-inline: auto;
      padding: 18px 16px 50px;
    }

    .layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    /* ============================================================
       Sidebar
       ============================================================ */

    .sidebar {
      position: sticky;
      top: 18px;
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 36px);
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid var(--border-muted);
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
    }

    .brand-mark svg {
      width: 18px;
      height: 18px;
    }

    .brand-name {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -.025em;
    }

    .brand-caption {
      color: var(--subtle);
      font-size: .65rem;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 12px 8px;
      overflow-y: auto;
    }

    .nav-section {
      padding: 12px 9px 5px;
      color: var(--subtle);
      font: 600 .6rem var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .nav-button {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-height: 36px;
      padding: 7px 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: .76rem;
      font-weight: 550;
      text-align: left;
    }

    .nav-button:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .nav-button.active {
      background: var(--nav-active-bg);
      color: var(--text);
    }

    .nav-button.active svg {
      color: var(--accent);
    }

    .nav-button svg {
      width: 15px;
      height: 15px;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 10px;
      border-top: 1px solid var(--border-muted);
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px;
      color: var(--subtle);
      font-size: .65rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px var(--ok-bg);
    }

    /* ============================================================
       Main
       ============================================================ */

    .main {
      min-width: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .page-title {
      font-size: 1.2rem;
      font-weight: 650;
      letter-spacing: -.025em;
    }

    .page-subtitle {
      margin-top: 2px;
      color: var(--subtle);
      font-size: .7rem;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
    }

    .icon-button:hover {
      color: var(--text);
      background: var(--surface-2);
    }

    .icon-button svg {
      width: 16px;
      height: 16px;
    }

    /* ============================================================
       Panels
       ============================================================ */

    .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    .panel + .panel {
      margin-top: 14px;
    }

    .panel-header {
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 13px;
      border-bottom: 1px solid var(--border);
    }

    .panel-title {
      font-size: .82rem;
      font-weight: 650;
    }

    .panel-meta {
      color: var(--muted);
      font: .64rem var(--mono);
      white-space: nowrap;
    }

    .panel-body {
      padding: 13px;
    }

    /* ============================================================
       Profile
       ============================================================ */

    .profile {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
    }

    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface-2);
      object-fit: cover;
    }

    .profile-name {
      font-size: 1rem;
      font-weight: 650;
    }

    .profile-login {
      margin-top: 1px;
      color: var(--muted);
      font: .68rem var(--mono);
    }

    .profile-bio {
      margin-top: 6px;
      color: var(--muted);
      font-size: .72rem;
      line-height: 1.45;
    }

    .profile-stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    .profile-stat {
      min-width: 74px;
      padding: 8px 10px;
      border: 1px solid var(--border-muted);
      border-radius: 6px;
      background: var(--bg-deep);
      text-align: center;
    }

    .profile-stat strong {
      display: block;
      font-size: .85rem;
    }

    .profile-stat span {
      color: var(--subtle);
      font: .58rem var(--mono);
    }

    /* ============================================================
       Search / source
       ============================================================ */

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 105px auto;
      gap: 7px;
    }

    .toolbar-extra {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--bg-deep);
      color: var(--text);
      font-size: .75rem;
    }

    .input,
    .select {
      height: 38px;
      padding: 7px 10px;
    }

    .input {
      font-family: var(--mono);
    }

    .textarea {
      min-height: 160px;
      padding: 10px;
      resize: vertical;
      font: .7rem/1.6 var(--mono);
    }

    .input::placeholder,
    .textarea::placeholder {
      color: var(--subtle);
    }

    .button {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      cursor: pointer;
      font-size: .75rem;
      font-weight: 600;
      white-space: nowrap;
      text-decoration: none;
    }

    .button svg {
      width: 14px;
      height: 14px;
    }

    .button-primary {
      border-color: transparent;
      background: var(--green);
      color: var(--on-primary);
    }

    .button-primary:hover {
      background: var(--green-hover);
    }

    .button-secondary {
      background: var(--surface-2);
      color: var(--text);
    }

    .button-secondary:hover {
      background: var(--surface-3);
    }

    .button-danger {
      background: transparent;
      color: var(--red);
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .source-tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .source-tabs::-webkit-scrollbar {
      display: none;
    }

    .source-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 6px 10px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: .73rem;
      font-weight: 550;
      white-space: nowrap;
    }

    .source-tab.active {
      color: var(--text);
      border-bottom-color: #fd8c73;
    }

    .source-tab svg {
      width: 14px;
      height: 14px;
    }

    .source-panel[hidden] {
      display: none;
    }

    .status {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      margin-top: 9px;
      padding: 8px 10px;
      border: 1px solid var(--border-muted);
      border-radius: 6px;
      color: var(--muted);
      font-size: .68rem;
    }

    .status[hidden] {
      display: none;
    }

    .status.success {
      color: var(--ok-text);
      background: var(--ok-bg);
      border-color: var(--ok-border);
    }

    .status.error {
      color: var(--err-text);
      background: var(--err-bg);
      border-color: var(--err-border);
    }

    .status.warning {
      color: var(--warn-text);
      background: var(--warn-bg);
      border-color: var(--warn-border);
    }

    .hint {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-top: 8px;
      color: var(--subtle);
      font-size: .65rem;
      line-height: 1.5;
    }

    .hint svg {
      width: 13px;
      height: 13px;
      margin-top: 1px;
    }

    /* ============================================================
       Advanced (token)
       ============================================================ */

    .advanced {
      margin-top: 10px;
      border: 1px solid var(--border-muted);
      border-radius: 7px;
      background: var(--bg-deep);
      overflow: hidden;
    }

    .advanced > summary {
      padding: 9px 10px;
      cursor: pointer;
      color: var(--muted);
      font-size: .68rem;
      font-weight: 600;
      list-style: none;
      user-select: none;
    }

    .advanced > summary::-webkit-details-marker {
      display: none;
    }

    .advanced > summary::before {
      content: "▸";
      display: inline-block;
      margin-right: 7px;
      transition: transform .15s ease;
    }

    .advanced[open] > summary::before {
      transform: rotate(90deg);
    }

    .advanced-body {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 0 10px 11px;
    }

    .github-app-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      margin-top: 10px;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
    }

    .github-app-copy strong { display: block; font-size: .72rem; }
    .github-app-copy span { display: block; margin-top: 2px; color: var(--muted); font-size: .63rem; }
    .github-app-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .github-app-badge { display: inline-flex; align-items: center; gap: 5px; color: var(--subtle); font: .58rem var(--mono); }
    .github-app-badge.connected { color: var(--ok-text); }
    @media (max-width: 680px) {
      .github-app-card { grid-template-columns: 1fr; }
      .github-app-actions { justify-content: flex-start; }
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: .68rem;
      cursor: pointer;
    }

    .checkbox input {
      accent-color: var(--accent);
    }

    /* ============================================================
       Dashboard cards
       ============================================================ */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .stat-card {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .stat-label {
      color: var(--muted);
      font-size: .65rem;
      font-weight: 550;
    }

    .stat-value {
      margin-top: 2px;
      font-size: 1.4rem;
      font-weight: 650;
      letter-spacing: -.04em;
    }

    .stat-unit {
      color: var(--subtle);
      font: .62rem var(--mono);
      letter-spacing: 0;
    }

    .stat-detail {
      min-height: 15px;
      margin-top: 2px;
      color: var(--subtle);
      font: .6rem var(--mono);
    }

    /* ============================================================
       Two column sections
       ============================================================ */

    .two-column {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(280px, .75fr);
      gap: 14px;
    }

    .two-column > .panel {
      margin-top: 0;
    }

    /* ============================================================
       Calendar
       ============================================================ */

    .calendar-scroll {
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .calendar-shell {
      display: grid;
      grid-template-columns: 27px max-content;
      gap: 7px;
      width: max-content;
      min-width: 100%;
    }

    .weekday-axis {
      display: grid;
      grid-template-rows: 17px repeat(7, 11px);
      gap: 3px;
    }

    .weekday-axis span {
      color: var(--subtle);
      font: 9px/11px var(--mono);
    }

    .calendar-main {
      width: max-content;
    }

    .month-axis {
      position: relative;
      height: 17px;
    }

    .month-label {
      position: absolute;
      top: 0;
      color: var(--subtle);
      font: 9px/13px var(--mono);
    }

    .calendar-grid {
      display: grid;
      grid-template-rows: repeat(7, 11px);
      grid-auto-flow: column;
      grid-auto-columns: 11px;
      gap: 3px;
      width: max-content;
    }

    .day {
      width: 11px;
      height: 11px;
      padding: 0;
      border: 0;
      border-radius: 2px;
      background: var(--heat-0);
      cursor: pointer;
    }

    .day:hover {
      outline: 2px solid var(--day-outline);
      outline-offset: 1px;
    }

    .day[data-level="1"] { background: var(--heat-1); }
    .day[data-level="2"] { background: var(--heat-2); }
    .day[data-level="3"] { background: var(--heat-3); }
    .day[data-level="4"] { background: var(--heat-4); }

    .placeholder {
      visibility: hidden;
      pointer-events: none;
    }

    .calendar-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 11px;
      color: var(--muted);
      font-size: .64rem;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-cell {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }

    .legend-cell[data-level="0"] { background: var(--heat-0); }
    .legend-cell[data-level="1"] { background: var(--heat-1); }
    .legend-cell[data-level="2"] { background: var(--heat-2); }
    .legend-cell[data-level="3"] { background: var(--heat-3); }
    .legend-cell[data-level="4"] { background: var(--heat-4); }

    /* ============================================================
       Charts
       ============================================================ */

    .chart {
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 8px;
    }

    .bars {
      display: grid;
      grid-template-columns: repeat(12, minmax(12px, 1fr));
      align-items: end;
      gap: 7px;
      height: 150px;
      padding-top: 15px;
    }

    .bar-column {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
    }

    .bar-value {
      color: var(--subtle);
      font: 8px var(--mono);
      opacity: 0;
      transition: opacity .15s;
    }

    .bar-column:hover .bar-value {The requested file reference is not currently visible. Use files.search or files.list to rediscover the file, then retry with a returned ref_id or file_id.
